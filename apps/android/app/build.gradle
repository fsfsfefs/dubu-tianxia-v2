plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}
android {
    namespace 'cn.dubutianxia.tablet'
    compileSdk 35
    defaultConfig {
        applicationId 'cn.dubutianxia.tablet'
        minSdk 28
        targetSdk 35
        versionCode 20001
        versionName '2.0-tablet-1'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        debug { storeFile rootProject.file('../../.tmp/android-signing/debug.keystore') }
        personal {
            if (System.getenv('DUBU_SIGNING_STORE')) {
                storeFile file(System.getenv('DUBU_SIGNING_STORE'))
                storePassword System.getenv('DUBU_SIGNING_PASSWORD')
                keyAlias 'dubutianxia'
                keyPassword System.getenv('DUBU_SIGNING_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.personal } }
    sourceSets { main { assets.srcDir '../../../.tmp/android-payload/assets' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging false } }
    testOptions { animationsDisabled true }
}
chaquopy {
    defaultConfig {
        version '3.12'
        if (System.getenv('DUBU_BUILD_PYTHON')) { buildPython System.getenv('DUBU_BUILD_PYTHON') }
        pip {
            options '--extra-index-url', 'https://pypi.flet.dev'
            install '-r', '../../../android/requirements.txt'
        }
    }
    sourceSets { main { srcDir '../../../.tmp/android-payload/python' } }
}
dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
